# Compile mousquet.exe sur Windows à chaque push, et le publie dans une Release GitHub à chaque tag « v* ».
#
#   git tag v1.1.0
#   git push origin v1.1.0
#
# Sans tag (push sur main, ou lancement à la main depuis l'onglet Actions), l'exe compilé est seulement gardé comme
# artefact de la compilation.
name: mousquet.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compiler:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Essais
        run: cargo test --release

      - name: Compilation
        run: cargo build --release

      - name: Empreinte SHA-256
        shell: pwsh
        run: |
          Copy-Item target\release\mousquet.exe mousquet.exe
          $h = (Get-FileHash mousquet.exe -Algorithm SHA256).Hash.ToLower()
          "$h  mousquet.exe" | Out-File -Encoding ascii mousquet.exe.sha256
          Get-Content mousquet.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: mousquet
          path: |
            mousquet.exe
            mousquet.exe.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mousquet.exe
            mousquet.exe.sha256
          generate_release_notes: true
